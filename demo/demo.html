<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alico slider touch fix — phone test</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
<style>
 body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;margin:0 auto;padding:24px;color:#222}
 h2{font-size:20px}.amt{font-size:26px;font-weight:700;color:#0a7;margin:8px 0 28px}
 .track{position:relative;height:10px;background:#e6e6e6;border-radius:5px;margin:40px 4px}
 .track .ui-slider-handle{position:absolute;top:-9px;width:28px;height:28px;margin-left:-14px;
   background:#0a7;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);border-radius:50%;
   cursor:pointer;outline:none;touch-action:none}
 .track .ui-slider-range{position:absolute;top:0;height:100%;background:#0a7;border-radius:5px}
 .note{background:#f3f7f5;border-left:4px solid #0a7;padding:12px 14px;border-radius:6px;font-size:14px}
</style></head><body>
<h2>Compare quotes — coverage amount</h2>
<div class="amt" id="amt">$60,000</div>
<div id="cov" class="track ct-range-slider"></div>
<p class="note">Drag the handle with your finger. With the fix loaded it slides smoothly to any
value on iOS Safari and Android Chrome — exactly like on desktop.</p>
<script>
$(function(){
  $('#cov').slider({range:'min',min:0,max:100000,value:60000,step:1000,
    slide:function(e,u){$('#amt').text('$'+u.value.toLocaleString());},
    change:function(e,u){$('#amt').text('$'+u.value.toLocaleString());}});
});
</script>
<script src="../alico-slider-touch-fix.js"></script>
</body></html>
